          type: integer
        active:
          type: integer
        completed:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
      required:
      - active
      - by_status
      - completed
      - total
    ReserveInventory:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
      required:
      - quantity
    RoleEnum:
      enum:
      - SEEKER
      - DONOR
      - CAMP_ORGANIZER
      type: string
      description: |-
        * `SEEKER` - SEEKER
        * `DONOR` - DONOR
        * `CAMP_ORGANIZER` - CAMP_ORGANIZER
    SourceEnum:
      enum:
