      - ISSUED
      - EXPIRED
      - TRANSFER_IN
      - TRANSFER_OUT
      - ADJUSTMENT
      type: string
      description: |-
        * `DONATION` - Donation
        * `RECEIVED` - Received
        * `ISSUED` - Issued
        * `EXPIRED` - Expired
        * `TRANSFER_IN` - Transfer In
        * `TRANSFER_OUT` - Transfer Out
        * `ADJUSTMENT` - Adjustment
    UrgencyEnum:
      enum:
      - NORMAL
      - URGENT
      - EMERGENCY
