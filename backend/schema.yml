openapi: 3.0.3
info:
  title: BloodConnect API
  version: 1.0.0
  description: REST API for blood-bank discovery, blood requests, donations and camp
    coordination.
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: v1_auth_change_password_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Log in with email and password
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_auth_me_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      summary: Register a new user
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/blood-banks/:
    get:
      operationId: v1_blood_banks_list
      parameters:
      - in: query
        name: apheresis_available
        schema:
          type: boolean
      - in: query
        name: category
        schema:
          type: string
          enum:
          - CHARITY
          - GOVERNMENT
          - OTHER
          - PRIVATE
        description: |-
          * `GOVERNMENT` - Government
          * `PRIVATE` - Private
          * `CHARITY` - Charity
          * `OTHER` - Other
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: component_available
        schema:
          type: boolean
      - in: query
        name: district
        schema:
          type: string
      - in: query
        name: has_coordinates
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: pincode
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: verified
        schema:
          type: boolean
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBloodBankListList'
          description: ''
    post:
      operationId: v1_blood_banks_create
      summary: Register a blood bank
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodBankCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodBankCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodBankCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodBankDetail'
          description: ''
  /api/v1/blood-banks/{slug}/:
    get:
      operationId: v1_blood_banks_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodBankDetail'
          description: ''
    put:
      operationId: v1_blood_banks_update
      summary: Update a blood bank
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodBankCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodBankCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodBankCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodBankDetail'
          description: ''
    patch:
      operationId: v1_blood_banks_partial_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBloodBankCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBloodBankCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBloodBankCreateUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodBankCreateUpdate'
          description: ''
    delete:
      operationId: v1_blood_banks_destroy
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/blood-banks/{slug}/verify/:
    post:
      operationId: v1_blood_banks_verify_create
      summary: Approve or reject a blood bank
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodBankVerificationDecision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodBankVerificationDecision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodBankVerificationDecision'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodBankVerification'
          description: ''
  /api/v1/blood-banks/nearby/:
    get:
      operationId: v1_blood_banks_nearby_list
      summary: Find nearby blood banks
      parameters:
      - in: query
        name: apheresis_available
        schema:
          type: boolean
      - in: query
        name: category
        schema:
          enum:
          - GOVERNMENT
          - PRIVATE
          - CHARITY
          - OTHER
          type: string
          minLength: 1
        description: |-
          * `GOVERNMENT` - Government
          * `PRIVATE` - Private
          * `CHARITY` - Charity
          * `OTHER` - Other
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: component_available
        schema:
          type: boolean
      - in: query
        name: district
        schema:
          type: string
      - in: query
        name: has_coordinates
        schema:
          type: boolean
      - in: query
        name: latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        required: true
      - in: query
        name: longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: pincode
        schema:
          type: string
      - in: query
        name: radius_km
        schema:
          type: number
          format: double
          maximum: 100
          minimum: 1
          default: 10.0
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: verified
        schema:
          type: boolean
      - in: query
        name: verified_only
        schema:
          type: boolean
          default: false
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNearbyBloodBankList'
          description: ''
  /api/v1/blood-components/:
    get:
      operationId: v1_blood_components_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloodComponent'
          description: ''
  /api/v1/blood-components/{id}/:
    get:
      operationId: v1_blood_components_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blood component.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodComponent'
          description: ''
  /api/v1/blood-groups/:
    get:
      operationId: v1_blood_groups_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloodGroup'
          description: ''
  /api/v1/blood-groups/{id}/:
    get:
      operationId: v1_blood_groups_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blood group.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodGroup'
          description: ''
  /api/v1/blood-requests/:
    get:
      operationId: v1_blood_requests_list
      parameters:
      - in: query
        name: assigned_to_my_bank
        schema:
          type: boolean
      - in: query
        name: blood_bank
        schema:
          type: string
          format: uuid
      - in: query
        name: blood_group
        schema:
          type: string
          format: uuid
      - in: query
        name: component
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: request_number
        schema:
          type: string
      - in: query
        name: required_from
        schema:
          type: string
          format: date
      - in: query
        name: required_to
        schema:
          type: string
          format: date
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACCEPTED
          - CANCELLED
          - COMPLETED
          - EXPIRED
          - PARTIALLY_FULFILLED
          - PENDING
          - REJECTED
          - UNDER_REVIEW
        description: |-
          * `PENDING` - Pending
          * `UNDER_REVIEW` - Under Review
          * `ACCEPTED` - Accepted
          * `PARTIALLY_FULFILLED` - Partially Fulfilled
          * `REJECTED` - Rejected
          * `CANCELLED` - Cancelled
          * `COMPLETED` - Completed
          * `EXPIRED` - Expired
      - in: query
        name: urgency
        schema:
          type: string
          enum:
          - EMERGENCY
          - NORMAL
          - URGENT
        description: |-
          * `NORMAL` - Normal
          * `URGENT` - Urgent
          * `EMERGENCY` - Emergency
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBloodRequestListList'
          description: ''
    post:
      operationId: v1_blood_requests_create
      summary: Submit a blood requirement
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodRequestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodRequestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodRequestCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequestDetail'
          description: ''
  /api/v1/blood-requests/{id}/:
    get:
      operationId: v1_blood_requests_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blood request.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequestDetail'
          description: ''
  /api/v1/blood-requests/{id}/assign-bank/:
    post:
      operationId: v1_blood_requests_assign_bank_create
      summary: Assign a blood bank to a request
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blood request.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignBloodBank'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignBloodBank'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignBloodBank'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequestDetail'
          description: ''
  /api/v1/blood-requests/{id}/assignment-history/:
    get:
      operationId: v1_blood_requests_assignment_history_list
      summary: View blood-bank assignment history
      parameters:
      - in: query
        name: assigned_to_my_bank
        schema:
          type: boolean
      - in: query
        name: blood_bank
        schema:
          type: string
          format: uuid
      - in: query
        name: blood_group
        schema:
          type: string
          format: uuid
      - in: query
        name: component
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blood request.
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: request_number
        schema:
          type: string
      - in: query
        name: required_from
        schema:
          type: string
          format: date
      - in: query
        name: required_to
        schema:
          type: string
          format: date
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACCEPTED
          - CANCELLED
          - COMPLETED
          - EXPIRED
          - PARTIALLY_FULFILLED
          - PENDING
          - REJECTED
          - UNDER_REVIEW
        description: |-
          * `PENDING` - Pending
          * `UNDER_REVIEW` - Under Review
          * `ACCEPTED` - Accepted
          * `PARTIALLY_FULFILLED` - Partially Fulfilled
          * `REJECTED` - Rejected
          * `CANCELLED` - Cancelled
          * `COMPLETED` - Completed
          * `EXPIRED` - Expired
      - in: query
        name: urgency
        schema:
          type: string
          enum:
          - EMERGENCY
          - NORMAL
          - URGENT
        description: |-
          * `NORMAL` - Normal
          * `URGENT` - Urgent
          * `EMERGENCY` - Emergency
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBloodRequestBankAssignmentList'
          description: ''
  /api/v1/blood-requests/{id}/cancel/:
    post:
      operationId: v1_blood_requests_cancel_create
      summary: Cancel a blood request
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blood request.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodRequestCancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodRequestCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodRequestCancel'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequestDetail'
          description: ''
  /api/v1/blood-requests/{id}/fulfil-inventory/:
    post:
      operationId: v1_blood_requests_fulfil_inventory_create
      summary: Fulfil a request using reserved inventory
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blood request.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FulfilInventory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FulfilInventory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FulfilInventory'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequestDetail'
          description: ''
  /api/v1/blood-requests/{id}/history/:
    get:
      operationId: v1_blood_requests_history_list
      summary: View blood-request status history
      parameters:
      - in: query
        name: assigned_to_my_bank
        schema:
          type: boolean
      - in: query
        name: blood_bank
        schema:
          type: string
          format: uuid
      - in: query
        name: blood_group
        schema:
          type: string
          format: uuid
      - in: query
        name: component
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blood request.
        required: true
