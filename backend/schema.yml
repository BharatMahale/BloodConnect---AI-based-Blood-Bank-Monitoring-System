components:
  schemas:
    AddressQuery:
      type: object
      properties:
        address:
          type: string
          maxLength: 250
      required:
      - address
    AssignBloodBank:
      type: object
      properties:
        blood_bank:
          type: string
          format: uuid
        reason:
          type: string
          default: ''
          maxLength: 1000
      required:
      - blood_bank
    BloodBankCreateUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          $ref: '#/components/schemas/CategoryEnum'
        location:
          $ref: '#/components/schemas/Location'
        contact_number:
          type: string
          maxLength: 100
        mobile_number:
          type: string
          maxLength: 100
        helpline:
          type: string
          maxLength: 100
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        service_time:
          type: string
          maxLength: 100
        license_number:
          type: string
          maxLength: 150
